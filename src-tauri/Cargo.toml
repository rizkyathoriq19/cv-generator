[package]
name = "cv-generator"
version = "0.1.0"
description = "Offline desktop CV generator"
edition = "2021"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
